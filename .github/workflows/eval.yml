name: Eval Gate

# Pull requests only. This job spends real OpenAI credit on every run — agent
# regressions plus a full ragas pass — and running it again on push to main
# would re-score the identical tree the PR just scored, at double the cost.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      # --ragas is what puts the RAG pipeline behind this gate; without it only
      # the agent regressions run. The script writes progress to stderr and the
      # report to stdout, so the redirect below captures parseable JSON, and it
      # exits non-zero when any floor is missed — that exit code is the gate.
      - name: Run eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python scripts/eval_gate.py --ragas --json > eval_results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json
