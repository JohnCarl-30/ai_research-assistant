[project]
name = "scout-mcp"
version = "0.2.0"
description = "Keyless company research for Claude: public data sources and a local notebook"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # streamable_http_client(http_client=...) is the 1.30 transport API.
    "mcp>=1.30,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
]

[project.scripts]
scout-mcp = "scout_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["scout_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
