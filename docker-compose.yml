version: '3.8'

services:
  postgres:
    # pgvector build of Postgres 16 — the stock postgres image has no `vector`
    # extension, so app.database.init_db() cannot create the embedding column.
    image: pgvector/pgvector:pg16
    container_name: scout-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
