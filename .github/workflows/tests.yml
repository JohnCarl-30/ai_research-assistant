name: Tests

# CI runs the offline unit suite and nothing else. No OpenAI key is configured
# here and none should be: every tier of the eval gate calls OpenAI — the cheap
# tier still embeds the corpus and one vector per question, and the judged tier
# generates and scores an answer for each of 41 questions — so any of it running
# here would bill real money on every push, on a public repo where pull requests
# can be opened by anyone.
#
# The eval gate is a local, pre-merge step instead:
#
#     uv run python scripts/eval_gate.py --retrieval-only   # cheap, ~16s
#     uv run python scripts/eval_gate.py --ragas            # full, judged
#     RUN_EVAL=1 uv run pytest tests/eval                   # same as pass/fail
#
# See the Evaluation section of README.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # --extra dev is required, not optional tidiness: pytest and aiosqlite
      # both live there, and a plain `uv sync` installs neither.
      - name: Install dependencies
        run: uv sync --extra dev

      # tests/eval is excluded by its RUN_EVAL guard, so this stays offline.
      # conftest.py defaults a placeholder OPENAI_API_KEY so collection does not
      # need a real one.
      - name: Unit tests
        run: uv run pytest -q

  extension-manifests:
    name: Extension manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned to the versions the manifests were validated with locally.
      - name: Validate the Desktop manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate extension/manifest.json

      - name: Validate the Claude Code plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.291 plugin validate extension --strict
          npx --yes @anthropic-ai/claude-code@2.1.291 plugin validate . --strict
