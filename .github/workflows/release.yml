name: Release extension

# Builds the Claude Desktop extension and publishes it as a GitHub Release,
# in either of two ways:
#
# - Push a tag vX.Y.Z matching "version" in extension/manifest.json.
# - Run it by hand on main with "publish" ticked: GitHub creates the tag
#   v<version> on that commit and publishes the release. Useful where tags
#   can't be pushed directly.
#
# Run it by hand without "publish" for a dry run: same checks, and the .mcpb
# is kept as a workflow artifact instead of being released.
#
# Claude Code users install from the repository itself (the marketplace in
# .claude-plugin/), so the release only needs to carry the Desktop bundle.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag this commit v<version> and publish the release (main only)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  MCPB: "@anthropic-ai/mcpb@2.1.2"
  CLAUDE_CODE: "@anthropic-ai/claude-code@2.1.291"

jobs:
  release:
    name: Build and publish scout.mcpb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the extension version
        id: version
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the extension version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension/manifest.json version $VERSION"
            exit 1
          fi

      - name: Check a manual publish is allowed
        if: inputs.publish
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish by hand only from main (this run is on $GITHUB_REF)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists; bump the version in extension/manifest.json"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --extra dev

      # The whole offline suite, including tests/test_packaging.py, which keeps
      # the Desktop manifest, plugin manifest and marketplace in step.
      - name: Tests
        run: uv run pytest -q

      - name: Lint the extension
        run: uv run ruff check extension

      - name: Validate the Desktop manifest
        run: npx --yes "$MCPB" validate extension/manifest.json

      - name: Validate the Claude Code plugin and marketplace
        run: |
          npx --yes "$CLAUDE_CODE" plugin validate extension --strict
          npx --yes "$CLAUDE_CODE" plugin validate . --strict

      - name: Pack the Desktop extension
        working-directory: extension
        run: npx --yes "$MCPB" pack . "../scout-${{ steps.version.outputs.version }}.mcpb"

      - name: Keep the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ steps.version.outputs.version }}.mcpb
          path: scout-${{ steps.version.outputs.version }}.mcpb

      # On a tag push the tag already exists; on a manual publish, --target
      # makes GitHub create it on the commit this run built.
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "scout-$VERSION.mcpb" \
            --target "$GITHUB_SHA" \
            --title "Scout $VERSION" \
            --generate-notes
